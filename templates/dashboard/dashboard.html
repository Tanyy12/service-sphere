{% extends 'base.html' %}
{% block content %}
<h2>Analytics Dashboard</h2>

<div class="row mt-4">
  <div class="col-md-6">
    <h5>Bookings Trend</h5>
    <canvas id="trendChart"></canvas>
  </div>
  <div class="col-md-6">
    <h5>Service Performance</h5>
    <canvas id="performanceChart"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function () {  
  const token = localStorage.getItem('access_token');

  async function loadDashboard() {
    const trendRes = await fetch('/api/analytics/bookings-trend/', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const trendData = await trendRes.json();

    const perfRes = await fetch('/api/analytics/service-performance/', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    const perfData = await perfRes.json();

    new Chart(document.getElementById('trendChart'), {
      type: 'line',
      data: {
        labels: trendData.map(d => d.date),
        datasets: [{
          label: 'Bookings per day',
          data: trendData.map(d => d.total_bookings),
          borderColor: 'rgb(75, 192, 192)',
          tension: 0.2
        }]
      }
    });

    new Chart(document.getElementById('performanceChart'), {
      type: 'bar',
      data: {
        labels: perfData.map(d => d.title),
        datasets: [{
          label: 'Bookings per service',
          data: perfData.map(d => d.booking_count),
          backgroundColor: 'rgba(54, 162, 235, 0.6)'
        }]
      }
    });
  }
  loadDashboard();
})();
</script>
{% endblock %}
